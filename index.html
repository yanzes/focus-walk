<!DOCTYPE html>
<html lang="es" data-accent="violet">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Focus Walk — notch de escritorio</title>
    <meta
      name="description"
      content="Notch de escritorio para Windows: música con letras sincronizadas, pomodoro, hidratación, shelf de archivos y tareas."
    />
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/notch.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'"
    />
    <script src="src/boot.js"></script>
  </head>
  <body>
    <!-- Sprite de iconos -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-music" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </g>
      </symbol>
      <symbol id="i-timer" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="13" r="8" />
          <path d="M12 9.5V13l2.5 1.5M9 2.5h6" />
        </g>
      </symbol>
      <symbol id="i-droplet" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21.5a7 7 0 0 0 7-7c0-4.6-7-11.5-7-11.5S5 9.9 5 14.5a7 7 0 0 0 7 7z" />
        </g>
      </symbol>
      <symbol id="i-shelf" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3 9 5-9 5-9-5 9-5z" />
          <path d="m3.5 12.5 8.5 4.7 8.5-4.7" />
          <path d="m3.5 16.8 8.5 4.7 8.5-4.7" />
        </g>
      </symbol>
      <symbol id="i-tasks" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h6" />
          <path d="m7.5 12 2.5 2.5L21 4" />
        </g>
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.1 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.3a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2A1.7 1.7 0 0 0 4.8 9a1.7 1.7 0 0 0-.4-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1h.3a2 2 0 1 1 0 4h-.3a1.7 1.7 0 0 0-1.5 1z" />
        </g>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5.2v13.6L19.5 12z" fill="currentColor" />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <g fill="currentColor">
          <rect x="7" y="5" width="3.6" height="14" rx="1.2" />
          <rect x="13.4" y="5" width="3.6" height="14" rx="1.2" />
        </g>
      </symbol>
      <symbol id="i-prev" viewBox="0 0 24 24">
        <g fill="currentColor">
          <path d="M18.5 5.2v13.6L8.4 12z" />
          <rect x="4.5" y="5" width="2.6" height="14" rx="1.2" />
        </g>
      </symbol>
      <symbol id="i-next" viewBox="0 0 24 24">
        <g fill="currentColor">
          <path d="M5.5 5.2v13.6L15.6 12z" />
          <rect x="16.9" y="5" width="2.6" height="14" rx="1.2" />
        </g>
      </symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3l4 4-4 4" />
          <path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 3.6c1.1 1.7 2.3 2.7 4.3 2.7H21" />
          <path d="M17 13l4 4-4 4" transform="translate(0 -1)" />
          <path d="M3 17h3.5c2 0 3.2-1 4.3-2.7M14.2 8.7C15.3 7 16.5 6 18.5 6H21" />
        </g>
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17v5" />
          <path d="M9 3h6l-1 6 3.5 3.5H5.5L9 9z" />
        </g>
      </symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24">
        <path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m4.5 12.5 5 5L20 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" />
          <path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3" />
        </g>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5" />
          <path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3" />
        </g>
      </symbol>
      <symbol id="i-volume" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z" />
          <path d="M15.5 9a4 4 0 0 1 0 6M18.5 6a8 8 0 0 1 0 12" />
        </g>
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4 5.2 18.8" />
        </g>
      </symbol>
      <symbol id="i-caps" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3.5 6.5 7H15v4H9v-4H5.5z" />
          <path d="M9 19.5h6" />
        </g>
      </symbol>
      <symbol id="i-headphones" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14v-2a8 8 0 0 1 16 0v2" />
          <rect x="2.5" y="13.5" width="4.5" height="7" rx="2" />
          <rect x="17" y="13.5" width="4.5" height="7" rx="2" />
        </g>
      </symbol>
      <symbol id="i-flame" viewBox="0 0 24 24">
        <path d="M12 22a6 6 0 0 0 6-6c0-5-6-13-6-13S6 11 6 16a6 6 0 0 0 6 6z" fill="currentColor" />
      </symbol>
      <symbol id="i-reset" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3" />
          <path d="M3.5 4.5V10H9" />
        </g>
      </symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9z" />
        </g>
      </symbol>
      <symbol id="i-power" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v8" />
          <path d="M18.4 6.6a9 9 0 1 1-12.8 0" />
        </g>
      </symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h11v5.5A4.5 4.5 0 0 1 10.5 19h-2A4.5 4.5 0 0 1 4 14.5z" />
          <path d="M15 10.5h2.2a2.5 2.5 0 0 1 0 5H15" />
          <path d="M4 21.5h12" />
        </g>
      </symbol>
    </svg>

    <!-- Escritorio simulado -->
    <div class="desktop" aria-hidden="true">
      <div class="desktop__brand">focus walk · preview</div>
      <div class="desktop__label">
        Pasa el cursor por el notch · <kbd>clic</kbd> para fijarlo ·
        <kbd>Esc</kbd> para cerrar · <kbd>←</kbd><kbd>→</kbd> páginas
      </div>
    </div>

    <!-- El notch -->
    <div class="notch" id="notch" data-state="collapsed" data-playing="true">
      <div class="notch__pill">
        <!-- Los ojos del notch dormido: parpadean y miran de un lado a otro. -->
        <div class="pill__eyes" aria-hidden="true">
          <span></span><span></span>
        </div>
        <div class="pill__text" id="pill-text">Cargando…</div>
        <div class="pill__meta" id="pill-meta">0:00</div>
        <div class="pill__clock" id="pill-clock">--:--</div>
        <div class="pill__progress" id="pill-progress"></div>
      </div>

      <div class="notch__panel">
        <header class="notch__head">
          <nav class="tabs" role="tablist" aria-label="Secciones del notch" id="tabs"></nav>
          <div class="head__actions">
            <button class="icon-btn" id="pin-btn" aria-pressed="false" title="Fijar abierto" aria-label="Fijar abierto">
              <svg aria-hidden="true"><use href="#i-pin" /></svg>
            </button>
            <button class="icon-btn" id="collapse-btn" title="Cerrar (Esc)" aria-label="Cerrar notch">
              <svg aria-hidden="true"><use href="#i-chevron-up" /></svg>
            </button>
            <button class="icon-btn icon-btn--power" id="power-btn" title="Apagar Focus Walk" aria-label="Apagar Focus Walk">
              <svg aria-hidden="true"><use href="#i-power" /></svg>
            </button>
          </div>
        </header>
        <div class="notch__body" id="page"></div>
      </div>
    </div>

    <!-- Overlays del sistema -->
    <div class="osd-wrap" id="osd-wrap" aria-live="polite"></div>
    <div class="nudge-wrap" id="nudge" aria-live="polite"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- Taskbar simulada: dispara los overlays -->
    <nav class="taskbar" aria-label="Controles del sistema simulado">
      <div class="taskbar__cluster">
        <button class="taskbar__btn" data-osd="volume">
          <svg aria-hidden="true"><use href="#i-volume" /></svg> Volumen
        </button>
        <button class="taskbar__btn" data-osd="brightness">
          <svg aria-hidden="true"><use href="#i-sun" /></svg> Brillo
        </button>
        <button class="taskbar__btn" data-osd="caps">
          <svg aria-hidden="true"><use href="#i-caps" /></svg> Mayús
        </button>
        <button class="taskbar__btn" data-osd="device">
          <svg aria-hidden="true"><use href="#i-headphones" /></svg> Auriculares
        </button>
      </div>
      <div class="taskbar__divider"></div>
      <div class="taskbar__clock">
        <div id="tb-time">--:--</div>
        <div id="tb-date">—</div>
      </div>
    </nav>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
